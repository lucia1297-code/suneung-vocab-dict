<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수능 어휘 사전 — 오프라인</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surf:#111827;--surf2:#1e293b;--border:#1e3a5f;
  --txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;
  --acc:#6366f1;--pur:#a78bfa;--gold:#fbbf24;
  --grn:#4ade80;--yel:#facc15;--red:#f87171;
}
body{font-family:'Georgia','바탕',serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#0a1628;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo-text h1{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:-.02em}
.logo-text p{font-size:10px;color:var(--txt3);font-family:sans-serif;margin-top:1px}
.hdr-tabs{margin-left:auto;display:flex;gap:5px}
.tbtn{padding:5px 12px;border-radius:6px;border:none;font-size:11px;font-family:sans-serif;cursor:pointer;background:var(--surf2);color:var(--txt2);transition:.15s}
.tbtn.on{background:var(--acc);color:#fff}
.main{flex:1;display:flex;overflow:hidden}
.panel{flex:1;overflow:auto;padding:20px;display:none}
.panel.on{display:block}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:36px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px}
.doc-list{display:none;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.doc-chip{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--surf2);border-radius:20px;padding:5px 6px 5px 12px;font-family:sans-serif;font-size:11px;color:var(--txt2);cursor:pointer;max-width:220px}
.doc-chip.on{border-color:var(--acc);color:var(--txt);background:rgba(99,102,241,.12)}
.doc-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.doc-chip-x{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:50%;flex-shrink:0;line-height:1}
.doc-chip-x:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.doc-add-chip{background:none;border:1px dashed var(--surf2);border-radius:20px;padding:5px 12px;font-family:sans-serif;font-size:11px;color:var(--txt3);cursor:pointer}
.doc-add-chip:hover{color:var(--txt2);border-color:var(--acc)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--acc);background:rgba(99,102,241,.06)}
.drop-zone .icon{font-size:40px;display:block;margin-bottom:10px}
.drop-zone p{font-family:sans-serif;font-size:13px;color:var(--txt2);line-height:1.6}
.up-btn{display:inline-block;margin-top:12px;padding:7px 18px;background:var(--acc);color:#fff;border-radius:7px;font-family:sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none}
.ocr-bar{background:#1c1a0a;border:1px solid #3d3200;border-radius:8px;padding:10px 14px;font-family:sans-serif;font-size:12px;color:var(--gold);display:none;align-items:center;gap:10px;margin-bottom:14px}
.ocr-bar .sp{width:16px;height:16px;border:2px solid #3d3200;border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrl-bar{display:none;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;font-family:sans-serif}
.ctrl-bar button{padding:5px 12px;border-radius:6px;border:1px solid var(--surf2);background:var(--surf);color:var(--txt2);font-size:11px;cursor:pointer}
.ctrl-bar button:hover:not(:disabled){color:var(--txt)}
.ctrl-bar button:disabled{opacity:.35;cursor:not-allowed}
.tip-box{background:var(--surf);border:1px solid var(--surf2);border-radius:8px;padding:10px 14px;font-family:sans-serif;font-size:11px;color:var(--txt3);margin-bottom:14px;line-height:1.6;display:none}
.tip-box strong{color:var(--txt2)}
.stats{background:var(--surf);border-radius:7px;padding:8px 14px;display:none;gap:16px;margin-bottom:14px;font-family:sans-serif;font-size:11px}
.stats.show{display:flex}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
#pdf-wrap{position:relative;display:none;width:100%}
#pdf-wrap canvas{display:block;border-radius:8px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.5)}
#text-layer{position:absolute;top:0;left:0;overflow:hidden;line-height:1}
#text-layer span[role="presentation"]{position:absolute;cursor:pointer;color:transparent;white-space:pre;transform-origin:0% 0%;font-size:var(--font-height);transform:scaleX(var(--scale-x,1)) rotate(var(--rotate,0deg))}
.ow{position:absolute;cursor:pointer;border-radius:2px;color:transparent;white-space:nowrap;overflow:hidden}
#word-highlight{position:fixed;pointer-events:none;background:rgba(99,102,241,.45);border-radius:2px;z-index:9998;display:none}
#popup{position:fixed;z-index:9999;width:310px;background:var(--bg);border-radius:11px;box-shadow:0 12px 48px rgba(0,0,0,.7);display:none;overflow:hidden}
.ph{padding:12px 14px 9px;border-bottom:1px solid var(--surf2);display:flex;justify-content:space-between;align-items:flex-start}
.pw{font-size:21px;font-weight:700;color:#f1f5f9;letter-spacing:-.02em}
.pp{font-size:11px;color:var(--txt3);font-family:sans-serif;margin-top:2px}
.plv{font-size:10px;font-family:sans-serif;padding:3px 8px;border-radius:20px;font-weight:700;flex-shrink:0}
.pb{padding:11px 14px}
.pko{font-size:18px;font-weight:700;color:var(--pur);margin-bottom:7px}
.pex{background:var(--surf2);border-radius:6px;padding:8px 10px;font-size:12px;font-style:italic;line-height:1.6;margin-bottom:9px}
.ptip{font-size:11px;font-family:sans-serif;color:var(--gold);background:#1c1a0a;border-left:3px solid var(--gold);padding:6px 9px;border-radius:0 5px 5px 0;line-height:1.5}
.pun{padding:16px 14px;font-family:sans-serif;font-size:12px;color:var(--txt2)}
.pun strong{display:block;font-size:15px;color:var(--txt);margin-bottom:5px}
.pcls{position:absolute;top:9px;right:11px;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:15px;font-family:sans-serif}
.pft{padding:7px 14px;border-top:1px solid var(--surf2);display:flex;justify-content:flex-end}
.pft button{font-size:10px;font-family:sans-serif;background:none;border:none;color:var(--txt3);cursor:pointer}
.wb-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.wb-hdr h2{font-family:sans-serif;font-size:14px;font-weight:600;color:var(--txt2)}
.wb-empty{text-align:center;color:var(--surf2);font-family:sans-serif;font-size:13px;padding:50px 0}
.wb-empty big{display:block;font-size:38px;margin-bottom:10px}
.wcard{background:var(--surf);border:1px solid var(--surf2);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;margin-bottom:7px}
.wc-en{font-size:15px;font-weight:700;color:#f1f5f9}
.wc-pos{font-size:10px;font-family:sans-serif;color:var(--txt3);margin-left:5px}
.wc-ko{font-size:13px;color:var(--pur);font-weight:600;margin-top:2px}
.wc-ex{font-size:10px;font-family:sans-serif;color:var(--txt3);margin-top:3px;font-style:italic}
.clrbtn{font-size:11px;font-family:sans-serif;background:none;border:1px solid var(--surf2);color:var(--txt3);padding:3px 9px;border-radius:5px;cursor:pointer}
.loader{text-align:center;padding:40px;font-family:sans-serif;color:var(--txt3)}
.lsp{display:inline-block;width:28px;height:28px;border:3px solid var(--surf2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="logo">📖</div>
  <div class="logo-text">
    <h1>수능 어휘 사전</h1>
    <p>PDF 위 단어 클릭 → 뜻 즉시 팝업</p>
  </div>
  <div class="hdr-tabs">
    <button class="tbtn on" onclick="showTab('viewer',this)">📄 지문</button>
    <button class="tbtn" onclick="showTab('wordbook',this)" id="wb-tab">📚 단어장</button>
  </div>
</header>

<div class="main">
<div class="panel on" id="panel-viewer">
<div style="max-width:860px;margin:0 auto">
  <div id="upload-area">
    <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
      <span class="icon">📄</span>
      <p><strong>PDF 파일을 드래그하거나 클릭해서 선택하세요</strong></p>
      <p style="margin-top:6px">텍스트 PDF · 스캔 이미지 PDF 모두 지원</p>
      <button class="up-btn" onclick="event.stopPropagation();document.getElementById('fi').click()">파일 선택</button>
    </div>
    <input type="file" id="fi" accept=".pdf" multiple style="display:none">
  </div>
  <div class="doc-list" id="doc-list"></div>
  <div class="ocr-bar" id="ocr-bar"><div class="sp"></div><div id="ocr-msg">OCR 처리 중…</div></div>
  <div class="tip-box" id="tip-box">
    💡 <strong>사용법:</strong> PDF 위의 단어를 클릭하면 수능 어휘 DB에서 뜻이 표시됩니다.
    이미지(스캔) PDF는 OCR로 자동 인식합니다. 여러 문서를 열어두고 위 목록에서 전환하거나 닫을 수 있습니다.
  </div>
  <div class="stats" id="stats">
    <div><span class="sdot" style="background:var(--grn)"></span><span style="font-family:sans-serif;font-size:11px">기본 <b id="ct-b">0</b></span></div>
    <div><span class="sdot" style="background:var(--yel)"></span><span style="font-family:sans-serif;font-size:11px">중급 <b id="ct-m">0</b></span></div>
    <div><span class="sdot" style="background:var(--red)"></span><span style="font-family:sans-serif;font-size:11px">고급 <b id="ct-a">0</b></span></div>
    <div style="margin-left:auto;font-family:sans-serif;font-size:11px">조회 <b id="ct-l">0</b></div>
  </div>
  <div class="ctrl-bar" id="ctrl-bar">
    <button onclick="changePage(-1)" id="bp">◀ 이전</button>
    <span style="font-size:11px;color:var(--txt2)"><span id="cp">1</span> / <span id="tp">1</span> 페이지</span>
    <button onclick="changePage(1)" id="bn">다음 ▶</button>
    <button onclick="changeZoom(-.2)">−</button>
    <button onclick="changeZoom(.2)">+</button>
    <button onclick="document.getElementById('fi').click()" style="margin-left:auto;color:var(--txt3)">📄 문서 추가</button>
  </div>
  <div id="pdf-loader" class="loader" style="display:none"><div class="lsp"></div><div>PDF 불러오는 중…</div></div>
  <div id="pdf-wrap">
    <canvas id="pdfcanvas"></canvas>
    <div id="text-layer"></div>
  </div>
</div>
</div>

<div class="panel" id="panel-wordbook">
<div style="max-width:680px;margin:0 auto">
  <div class="wb-hdr">
    <h2>단어장 — <span id="wb-cnt">0</span>개</h2>
    <button class="clrbtn" onclick="clearWB()">전체 삭제</button>
  </div>
  <div id="wb-list"><div class="wb-empty"><big>📚</big>아직 조회한 단어가 없습니다</div></div>
</div>
</div>
</div>

<div id="popup">
  <button class="pcls" onclick="closePopup()">✕</button>
  <div id="pop-content"></div>
  <div class="pft"><button onclick="closePopup()">닫기</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

// ── State ──
// docs: every open document, so you can read one, switch to another, and
// come back later without losing your place (page/zoom/OCR cache per doc).
let docs = []; // {id, name, pdfDoc, totPages, curPage, scale, ocrCache}
let activeDocId = null;
let docSeq = 0;
let wordbook = JSON.parse(sessionStorage.getItem('wb')||'[]');
let looked = 0;
let tWorker = null;

function activeDoc() {
  return docs.find(d => d.id === activeDocId) || null;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Tab ──
window.showTab = function(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('panel-' + id).classList.add('on');
  btn.classList.add('on');
  if (id === 'wordbook') renderWB();
  closePopup();
};

function updateBadge() {
  const n = wordbook.length;
  document.getElementById('wb-tab').textContent = `📚 단어장${n ? ' (' + n + ')' : ''}`;
  document.getElementById('wb-cnt').textContent = n;
  let b=0, m=0, a=0;
  wordbook.forEach(w => { if(w.level==='하') b++; else if(w.level==='중') m++; else a++; });

// ── Tesseract worker ──
async function getTWorker() {
  if (tWorker) return tWorker;
  tWorker = await Tesseract.createWorker('eng', 1, {
    logger: () => {}
  });
  return tWorker;
}

// ── File input ──
document.getElementById('fi').addEventListener('change', async function() {
  for (const f of this.files) await addDocument(f);
  this.value = '';
});

const dz = document.getElementById('dz');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', async e => {
  e.preventDefault(); dz.classList.remove('drag');
  for (const f of e.dataTransfer.files) {
    if (f.type === 'application/pdf') await addDocument(f);
  }
});

// ── Documents (open several, switch between them, close/release one) ──
async function addDocument(file) {
  document.getElementById('upload-area').style.display = 'none';
  document.getElementById('pdf-loader').style.display = 'block';
  const ab = await file.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({ data: ab }).promise;
  const doc = {
    id: ++docSeq,
    name: file.name.replace(/\.pdf$/i, ''),
    pdfDoc,
    totPages: pdfDoc.numPages,
    curPage: 1,
    scale: 1.4,
    ocrCache: {} // pageNum → [{word,x,y,w,h}]
  };
  docs.push(doc);
  document.getElementById('pdf-loader').style.display = 'none';
  await switchDoc(doc.id);
}

window.switchDoc = async function(id) {
  const doc = docs.find(d => d.id === id);
  if (!doc) return;
  activeDocId = id;
  closePopup();
  document.getElementById('doc-list').style.display = 'flex';
  document.getElementById('pdf-wrap').style.display = 'block';
  document.getElementById('ctrl-bar').style.display = 'flex';
  document.getElementById('tip-box').style.display = 'block';
  document.getElementById('stats').classList.add('show');
  renderDocList();
  await renderPage(doc.curPage);
};

window.closeDoc = function(id) {
  const idx = docs.findIndex(d => d.id === id);
  if (idx === -1) return;
  const wasActive = activeDocId === id;
  docs.splice(idx, 1);
  if (!wasActive) { renderDocList(); return; }
  activeDocId = null;
  if (docs.length) {
    switchDoc(docs[Math.min(idx, docs.length - 1)].id);
  } else {
    ['pdf-wrap','ctrl-bar','tip-box','ocr-bar','doc-list'].forEach(elId => {
      const el = document.getElementById(elId);
      if (el) el.style.display = 'none';
    });
    document.getElementById('stats').classList.remove('show');
    document.getElementById('upload-area').style.display = 'block';
  }
};

function renderDocList() {
  const list = document.getElementById('doc-list');
  list.innerHTML = docs.map(d => `
    <div class="doc-chip ${d.id === activeDocId ? 'on' : ''}" onclick="switchDoc(${d.id})">
      <span class="doc-chip-name">${escapeHtml(d.name)}</span>
      <button class="doc-chip-x" onclick="event.stopPropagation();closeDoc(${d.id})" title="닫기(해제)">✕</button>
    </div>`).join('') + '<button class="doc-add-chip" onclick="document.getElementById(\'fi\').click()">+ 문서 추가</button>';
}

window.changePage = async function(d) {
  const doc = activeDoc();
  if (!doc) return;
  const n = doc.curPage + d;
  if (n < 1 || n > doc.totPages) return;
  doc.curPage = n; closePopup();
  await renderPage(n);
};

window.changeZoom = async function(d) {
  const doc = activeDoc();
  if (!doc) return;
  doc.scale = Math.max(.6, Math.min(3.0, doc.scale + d));
  closePopup(); await renderPage(doc.curPage);
};

// ── Render ──
// The canvas is shared/reused across every page and document, so a render
// that's still in flight when the user flips pages or switches documents
// must be cancelled first — otherwise pdf.js refuses the next render() with
// "Cannot use the same canvas during multiple render() operations", and
// whichever call happens to finish last silently wins the DOM.
let currentRenderTask = null;
let renderSeq = 0;

async function renderPage(num) {
  const doc = activeDoc();
  if (!doc) return;
  const renderId = ++renderSeq;
  doc.curPage = num;
  document.getElementById('cp').textContent = num;
  document.getElementById('tp').textContent = doc.totPages;
  document.getElementById('bp').disabled = num <= 1;
  document.getElementById('bn').disabled = num >= doc.totPages;

  const page = await doc.pdfDoc.getPage(num);
  if (renderId !== renderSeq) return; // superseded while awaiting getPage()
  const vp = page.getViewport({ scale: doc.scale });
  const canvas = document.getElementById('pdfcanvas');
  const ctx = canvas.getContext('2d');

  if (currentRenderTask) {
    try { currentRenderTask.cancel(); } catch (e) {}
    currentRenderTask = null;
  }
  canvas.width = vp.width; canvas.height = vp.height;
  const task = page.render({ canvasContext: ctx, viewport: vp });
  currentRenderTask = task;
  try {
    await task.promise;
  } catch (e) {
    if (e?.name === 'RenderingCancelledException') return; // a newer render took over
    throw e;
  }
  if (currentRenderTask === task) currentRenderTask = null;
  if (renderId !== renderSeq) return; // a newer render started while we awaited

  const tl = document.getElementById('text-layer');
  tl.innerHTML = '';
  tl.style.cssText = `position:absolute;top:0;left:0;width:${vp.width}px;height:${vp.height}px;transform-origin:top left;`;
  // Scale text layer to match canvas display width
  const displayW = canvas.offsetWidth || canvas.width;
  const ratio = displayW / vp.width;
  tl.style.transform = `scale(${ratio})`;

  // Real text PDF → pdf.js's own TextLayer (correct per-glyph metrics/positioning).
  // Scanned/image PDF with no text at all → OCR.
  const tc = await page.getTextContent();
  if (renderId !== renderSeq) return; // superseded while awaiting getTextContent()
  const hasRealText = tc.items.some(it => it.str && it.str.trim());
  if (hasRealText) {
    const textLayer = new pdfjsLib.TextLayer({ textContentSource: tc, container: tl, viewport: vp });
    // TextLayer's constructor sizes the container via CSS custom properties
    // (--total-scale-factor etc.) that only exist in pdf.js's own full-viewer
    // stylesheet, which we don't load — so pin the container back to the
    // plain pixel size we already computed above.
    tl.style.width = vp.width + 'px';
    tl.style.height = vp.height + 'px';
    await textLayer.render();
    wireTextLayerClicks(tl);
  } else {
    if (doc.ocrCache[num]) {
      buildOCRLayer(tl, doc.ocrCache[num]);
    } else {
      await runOCR(doc, num, canvas, tl, vp);
    }
  }
}

// Find the exact word under a click inside a pdf.js TextLayer span, using the
// browser's own text hit-testing (correct for any font/kerning) instead of
// estimating word position from character counts.
function wireTextLayerClicks(container) {
  container.querySelectorAll('span[role="presentation"]').forEach(span => {
    if (!span.textContent || !span.textContent.trim()) return;
    span.addEventListener('click', e => {
      e.stopPropagation();
      const hit = wordAtPoint(e.clientX, e.clientY);
      if (hit) onWordHit(hit.word, hit.rect, e);
    });
  });
}

function pointInRect(x, y, rect, tolerance) {
  return rect && x >= rect.left - tolerance && x <= rect.right + tolerance &&
         y >= rect.top - tolerance && y <= rect.bottom + tolerance;
}

function wordFromTextNode(node, offset) {
  const text = node.textContent;
  const isWordChar = c => /[a-zA-Z'-]/.test(c);
  let start = offset, end = offset;
  while (start > 0 && isWordChar(text[start - 1])) start--;
  while (end < text.length && isWordChar(text[end])) end++;
  const clean = text.slice(start, end).replace(/[^a-zA-Z'-]/g, '');
  if (clean.length < 2) return null;
  const range = document.createRange();
  range.setStart(node, start);
  range.setEnd(node, end);
  const rect = range.getClientRects()[0] || range.getBoundingClientRect();
  return { word: clean, rect };
}

// document.caretRangeFromPoint/caretPositionFromPoint occasionally resolve to
// the wrong character on some browser/font combinations for text inside a
// CSS-transformed (scaleX-corrected) span, which would silently look up the
// wrong word. Scan every word in the text layer directly and pick the one
// whose own rendered box actually contains the click point.
function wordAtPointByScan(x, y) {
  const spans = document.querySelectorAll('#text-layer span[role="presentation"]');
  for (const span of spans) {
    if (!pointInRect(x, y, span.getBoundingClientRect(), 0)) continue;
    const node = span.firstChild;
    if (!node || node.nodeType !== Node.TEXT_NODE) continue;
    const text = node.textContent;
    const re = /[a-zA-Z'-]+/g;
    let m;
    while ((m = re.exec(text))) {
      if (m[0].length < 2) continue;
      const range = document.createRange();
      range.setStart(node, m.index);
      range.setEnd(node, m.index + m[0].length);
      const rect = range.getClientRects()[0];
      if (pointInRect(x, y, rect, 1)) {
        return { word: m[0].replace(/[^a-zA-Z'-]/g, ''), rect };
      }
    }
  }
  return null;
}

function wordAtPoint(x, y) {
  let node, offset, hit = null;
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    if (r && r.startContainer.nodeType === Node.TEXT_NODE) { node = r.startContainer; offset = r.startOffset; }
  } else if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (p && p.offsetNode.nodeType === Node.TEXT_NODE) { node = p.offsetNode; offset = p.offset; }
  }
  if (node) hit = wordFromTextNode(node, offset);
  if (hit && pointInRect(x, y, hit.rect, 1)) return hit;
  // The browser's own caret hit-test didn't land inside the word it named —
  // fall back to a direct geometric scan instead of trusting it.
  return wordAtPointByScan(x, y) || hit;
}

async function runOCR(doc, num, canvas, layer, vp) {
  const bar = document.getElementById('ocr-bar');
  bar.style.display = 'flex';
  document.getElementById('ocr-msg').textContent = `이미지 PDF OCR 처리 중… (${num}/${doc.totPages}페이지) 잠시 기다려주세요`;
  try {
    const tw = await getTWorker();
    const url = canvas.toDataURL('image/png');
    const { data: { words } } = await tw.recognize(url);
    const sw = vp.width / canvas.width, sh = vp.height / canvas.height;
    const items = [];
    for (const w of words) {
      if (!w.text || w.confidence < 35) continue;
      const clean = w.text.replace(/[^a-zA-Z'-]/g, '');
      if (clean.length < 2) continue;
      items.push({
        word: clean,
        x: w.bbox.x0 * sw, y: w.bbox.y0 * sh,
        w: (w.bbox.x1 - w.bbox.x0) * sw, h: (w.bbox.y1 - w.bbox.y0) * sh
      });
    }
    doc.ocrCache[num] = items;
    buildOCRLayer(layer, items);
  } catch(e) {
    document.getElementById('ocr-msg').textContent = 'OCR 오류 — 파일을 다시 시도해 보세요';
    setTimeout(() => bar.style.display = 'none', 3000);
    return;
  }
  bar.style.display = 'none';
}

function buildOCRLayer(layer, items) {
  for (const { word, x, y, w, h } of items) {
    const s = document.createElement('span');
    s.className = 'ow';
    s.dataset.word = word;
    s.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    s.addEventListener('click', e => { e.stopPropagation(); onWordHit(word, s.getBoundingClientRect(), e); });
    layer.appendChild(s);
  }
}

// ── Word click ──
function wordHighlightEl() {
  let el = document.getElementById('word-highlight');
  if (!el) {
    el = document.createElement('div');
    el.id = 'word-highlight';
    document.body.appendChild(el);
  }
  return el;
}

function onWordHit(word, rect, e) {
  const hl = wordHighlightEl();
  hl.style.left = rect.left + 'px';
  hl.style.top = rect.top + 'px';
  hl.style.width = rect.width + 'px';
  hl.style.height = rect.height + 'px';
  hl.style.display = 'block';
  looked++; document.getElementById('ct-l').textContent = looked;
  showPopup(word, e.clientX, e.clientY);
}

function showPopup(word, cx, cy) {
  const lower = word.toLowerCase();
  const entry = V[lower];
  const pop = document.getElementById('popup');
  const content = document.getElementById('pop-content');
  if (entry) {
    if (!wordbook.find(w => w.word === lower)) {
      wordbook.unshift({ word: lower, ...entry });
      if (wordbook.length > 60) wordbook = wordbook.slice(0, 60);
      sessionStorage.setItem('wb', JSON.stringify(wordbook));
      updateBadge();
    }
    const lc = LC[entry.level] || 'var(--pur)';
    content.innerHTML = `
      <div class="ph">
        <div><div class="pw">${word}</div><div class="pp">${entry.pos}</div></div>
        <div class="plv" style="background:${lc}22;color:${lc}">${LL[entry.level]||''}</div>
      </div>
      <div class="pb">
        <div class="pko">${entry.ko}</div>
        <div class="pex">${entry.ex}</div>
        <div class="ptip">✏️ ${TIPS[entry.level]||''}</div>
      </div>`;
    pop.style.border = `1px solid ${lc}66`;
    pop.style.boxShadow = `0 12px 48px rgba(0,0,0,.7),0 0 0 1px ${lc}22`;
  } else {
    content.innerHTML = `
      <div class="pun">
        <strong>${word}</strong>
        수능 어휘 DB에 없는 단어입니다.<br>
        <span style="font-size:10px;color:var(--txt3);margin-top:4px;display:block">사전에서 직접 확인하세요.</span>
      </div>`;
    pop.style.border = '1px solid var(--surf2)';
    pop.style.boxShadow = '0 8px 32px rgba(0,0,0,.5)';
  }
  const pw = 310, ph = 250;
  let left = cx + 10, top = cy + 10;
  if (left + pw > window.innerWidth - 8) left = cx - pw - 10;
  if (top + ph > window.innerHeight - 8) top = cy - ph - 10;
  pop.style.left = Math.max(4, left) + 'px';
  pop.style.top = Math.max(4, top) + 'px';
  pop.style.display = 'block';
}

window.closePopup = function() {
  document.getElementById('popup').style.display = 'none';
  wordHighlightEl().style.display = 'none';
};

// ── Wordbook ──
function renderWB() {
  const list = document.getElementById('wb-list');
  if (!wordbook.length) {
    list.innerHTML = '<div class="wb-empty"><big>📚</big>아직 조회한 단어가 없습니다</div>';
    return;
  }
  list.innerHTML = wordbook.map(w => `
    <div class="wcard">
      <div style="flex:1">
        <div><span class="wc-en">${w.word}</span><span class="wc-pos">${w.pos}</span></div>
        <div class="wc-ko">${w.ko}</div>
        <div class="wc-ex">${w.ex}</div>
      </div>
      <div style="font-size:10px;font-family:sans-serif;background:${(LC[w.level]||'var(--pur)')}22;color:${LC[w.level]||'var(--pur)'};padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;align-self:flex-start">${LL[w.level]||''}</div>
    </div>`).join('');
}

window.clearWB = function() {
  if (!confirm('단어장을 모두 지울까요?')) return;
  wordbook = []; sessionStorage.removeItem('wb');
  updateBadge(); renderWB();
};

// ── Keys ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePopup();
  if (e.key === 'ArrowRight' && activeDoc()) changePage(1);
  if (e.key === 'ArrowLeft' && activeDoc()) changePage(-1);
});

updateBadge();
</script>
</body>
